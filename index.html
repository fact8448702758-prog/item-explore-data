<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Item Explore Admin</title>
<style>
:root{--blue:#007AFF;--bg:#f4f7fb;--card:#fff;--text:#14213d;--muted:#6b7280;--line:#dbe3ee;--red:#d64545;--green:#1f9d55;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--card:#18223a;--text:#eef2fb;--muted:#9aa6bd;--line:#2b3a5a;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:18px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--blue);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:20px;margin:0}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 70px}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.08);margin-bottom:16px}
h2{font-size:22px;margin:0 0 12px}
label{display:block;font-weight:600;margin:14px 0 6px}
input{width:100%;padding:15px;font-size:18px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--text)}
input:focus{outline:none;border-color:var(--blue)}
button{width:100%;padding:16px;margin-top:18px;font-size:19px;font-weight:700;border:0;border-radius:14px;background:var(--blue);color:#fff}
button:disabled{opacity:.6}
button.s{width:auto;margin:0;padding:9px 16px;font-size:16px;background:#fff;color:var(--blue)}
button.g{background:transparent;color:var(--blue);margin-top:6px;padding:10px;font-size:16px}
.hint{color:var(--muted);font-size:15px;line-height:1.4;margin:6px 0 0}
.hidden{display:none!important}
#pv{width:100%;max-height:240px;object-fit:contain;border-radius:14px;margin-top:12px;background:var(--bg)}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row img{width:54px;height:54px;object-fit:cover;border-radius:10px;background:var(--bg)}
#toast{position:fixed;left:16px;right:16px;bottom:24px;max-width:520px;margin:auto;padding:15px 18px;border-radius:14px;color:#fff;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:20}
#toast.show{opacity:1}#toast.ok{background:var(--green)}#toast.err{background:var(--red)}
#ld{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;color:#fff;font-weight:600}
.sp{width:54px;height:54px;border:6px solid #cfe1ff;border-top-color:var(--blue);border-radius:50%;animation:r 1s linear infinite;margin-bottom:12px}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="ld" class="hidden"><div class="sp"></div><span id="ldt">Please wait…</span></div>
<div id="toast"></div>
<header><h1>Item Explore Admin</h1><button id="out" class="s hidden">Lock</button></header>
<div class="wrap">

<section id="login" class="card">
  <h2>Admin login</h2>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Your password">
  <button id="open">Login</button>
</section>

<section id="panel" class="hidden">
  <div class="card">
    <h2>Add / update product</h2>
    <label for="bc">Barcode number *</label>
    <input id="bc" type="number" inputmode="numeric" placeholder="8901058000026">
    <p class="hint">Same barcode again replaces the old entry.</p>
    <label for="en">Product name (English)</label>
    <input id="en" type="text" placeholder="Maggi Masala Noodles">
    <label for="hi">Product name (Hindi)</label>
    <input id="hi" type="text" placeholder="मैगी मसाला नूडल्स">
    <label for="hl">Product name (Hinglish)</label>
    <input id="hl" type="text" placeholder="Maggi Masala Noodles">
    <label for="rg">Product name (Regional)</label>
    <input id="rg" type="text" placeholder="Marathi / Punjabi name">
    <label for="cam">Product photo *</label>
    <input id="cam" type="file" accept="image/*" capture="environment">
    <p class="hint">↑ Take a photo with the camera. Or pick one from the gallery:</p>
    <input id="im" type="file" accept="image/*">
    <img id="pv" class="hidden" alt="Preview">
    <p class="hint">Auto-resized to 500 px and saved as [barcode].jpg</p>
    <button id="up">Upload</button>
  </div>
  <div class="card"><h2>Uploaded now</h2><div id="list"><p class="hint">Nothing yet.</p></div></div>
</section>
</div>

<script>
const API='/api';
const $=i=>document.getElementById(i);
let pw='',site='',tt,pic=null;
function toast(m,ok){const e=$('toast');e.textContent=m;e.className='show '+(ok?'ok':'err');clearTimeout(tt);tt=setTimeout(()=>e.className='',3500)}
function busy(b,m){$('ld').classList.toggle('hidden',!b);if(m)$('ldt').textContent=m}
async function call(body){
  if(API.indexOf('PASTE')===0)throw new Error('Server is not set up yet.');
  let r;try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Password':pw},body:JSON.stringify(body)})}
  catch(e){throw new Error('Cannot reach the server. Check internet.')}
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error(j.error||('Error '+r.status));return j}
function show(w){$('login').classList.toggle('hidden',w==='panel');$('panel').classList.toggle('hidden',w!=='panel');$('out').classList.toggle('hidden',w!=='panel')}
$('open').onclick=async()=>{
  const v=$('pw').value;if(!v)return toast('Enter your password.');
  pw=v;busy(true,'Checking…');
  try{const j=await call({action:'login'});site=j.site;$('pw').value='';show('panel');toast('Welcome back ✓',true)}
  catch(e){pw='';toast(e.message)}
  busy(false)};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('open').click()});
$('out').onclick=()=>{pw='';site='';show('login')};
function setPic(e){const f=e.target.files[0],p=$('pv');pic=f||null;if(!f){p.classList.add('hidden');return}p.src=URL.createObjectURL(f);p.classList.remove('hidden')}
$('im').onchange=setPic;$('cam').onchange=setPic;
function shrink(f){return new Promise((ok,no)=>{const img=new Image();img.onload=()=>{const m=500,k=Math.min(1,m/Math.max(img.width,img.height));
const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(img,0,0,cv.width,cv.height);
ok(cv.toDataURL('image/jpeg',.75).split(',')[1])};img.onerror=()=>no(new Error('Could not read this image.'));img.src=URL.createObjectURL(f)})}
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const put=(path,content,message)=>call({action:'put',path,content,message});
$('up').onclick=async()=>{
  const bc=$('bc').value.trim(),f=pic;
  if(!/^\d{6,14}$/.test(bc))return toast('Enter a valid barcode (6–14 digits).');
  if(!f)return toast('Choose a photo.');
  if(!f.type.startsWith('image/'))return toast('Only image files are allowed.');
  const nm={barcode:bc,nameEn:$('en').value.trim(),nameHi:$('hi').value.trim(),nameHinglish:$('hl').value.trim(),nameRegional:$('rg').value.trim()};
  if(!nm.nameEn&&!nm.nameHi&&!nm.nameHinglish&&!nm.nameRegional)return toast('Enter at least one name.');
  $('up').disabled=true;busy(true,'Uploading…');
  try{
    const img=await shrink(f);
    await put('images/'+bc+'.jpg',img,'Add image '+bc);
    nm.imageUrl=site+'/images/'+bc+'.jpg';
    await put('products/'+bc+'.json',b64(JSON.stringify(nm,null,2)),'Add product '+bc);
    const d=document.createElement('div');d.className='row';d.innerHTML='<img alt=""><div><b></b><span></span></div>';
    d.querySelector('img').src='data:image/jpeg;base64,'+img;
    d.querySelector('b').textContent=nm.nameEn||nm.nameHi||nm.nameHinglish||nm.nameRegional;
    d.querySelector('span').textContent=bc;
    const l=$('list');if(l.querySelector('p'))l.innerHTML='';l.prepend(d);
    ['bc','en','hi','hl','rg','im','cam'].forEach(i=>$(i).value='');pic=null;$('pv').classList.add('hidden');
    toast('Uploaded ✓',true);
  }catch(e){toast(e.message)}
  busy(false);$('up').disabled=false};
show('login');
</script>
</body>
</html>
